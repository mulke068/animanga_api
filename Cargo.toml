[package]
name = "api"
version = "0.0.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.11.0"
actix-cors = "0.7.1"
actix-web-actors = "4.3.0"
tokio = { version = "1.45.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
async-trait = "0.1.88"
surrealdb = "2.3.6"
surrealdb-core = "2.3.6"
redis = "0.32.2"
serde_json = "1.0.140"
log = "0.4.27"
env_logger = "0.11.8"
dotenv = "0.15.0"
once_cell = "1.21.3"
reqwest = "0.12.20"
regex = "1.11.1"
#crypto = "0.5.1"
#argon2 = "0.5.3"
#futures = "0.3.30"
rand = "0.8.5"
rand_core = "0.6.4"
rand_chacha = "0.3.1"
chrono = "0.4.41"
actix = "0.13.5"


[target.'cfg(unix)'.dependencies]
openssl = { version = "0.10.73" , features = ["vendored"]}

